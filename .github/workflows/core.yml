name: Core verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt build
      - run: python -m pytest -q
      - run: python -m build
      - shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          repo="$PWD"
          cd "$RUNNER_TEMP"
          iil validate "$repo/examples/valid/read_docs.json"
          iil review "$repo/examples/exact-update/guide-a.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: imperium-iil-distributions
          path: dist/
