[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imperium-iil"
dynamic = ["version", "dependencies"]
description = "Imperium Intent Language review core"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
iil-policy = "imperium_iil.standing:main"
iil-snapshot = "imperium_iil.github_snapshot:main"
iil = "imperium_iil.__main__:main"

[tool.setuptools]
packages = ["imperium_iil", "imperium_iil.schemas", "imperium_iil.fixtures"]

[tool.setuptools.package-dir]
"imperium_iil.schemas" = "schemas"
"imperium_iil.fixtures" = "fixtures"

[tool.setuptools.package-data]
"imperium_iil" = ["data/*.txt"]
"imperium_iil.schemas" = ["*.json"]
"imperium_iil.fixtures" = ["*.json"]

[tool.setuptools.dynamic]
version = {attr = "imperium_iil.__version__"}
dependencies = {file = ["requirements.txt"]}
